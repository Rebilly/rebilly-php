name: "Check SDK"

on:
  pull_request:

jobs:
  psalm:
    name: "Psalm"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: "Install PHP w/ Extensions"
        uses: rebilly/setup-php@main
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, curl, json
          tools: composer:v2

      - name: "Get composer cache directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "Install dependencies"
        run: composer install --no-interaction --no-scripts --no-suggest

      - name: "Run tests"
        run: vendor/bin/psalm --php-version=${{ matrix.php-version }}

  cs:
    name: "Coding Standards (8.0)"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: "Install PHP w/ Extensions"
        uses: rebilly/setup-php@main
        with:
          php-version: '8.0'
          extensions: mbstring, intl, curl, json
          tools: composer:v2

      - name: "Get composer cache directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "Install dependencies"
        run: composer install --no-interaction --no-scripts --no-suggest

      - uses: actions/cache@v4
        with:
          path: .php-cs-fixer.cache
          key: ${{ runner.os }}-cs-fixer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-cs-fixer-

      - name: "Run tests"
        run: vendor/bin/php-cs-fixer fix -vv --dry-run

  changesets:
    name: "Changesets"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect lockfile-only change
        id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          printf '%s\n' "$files"
          lockfile_only=true
          if [ -z "$files" ]; then
            lockfile_only=false
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ "$file" != "package-lock.json" ]; then
                lockfile_only=false
                break
              fi
            done <<< "$files"
          fi
          echo "lockfile_only=$lockfile_only" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: ${{ ! startsWith(github.head_ref, 'changeset-release/') && steps.diff.outputs.lockfile_only != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@rebilly"
          cache-dependency-path: "package-lock.json"

      - name: Install Dependencies
        if: ${{ ! startsWith(github.head_ref, 'changeset-release/') && steps.diff.outputs.lockfile_only != 'true' }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Changesets
        if: ${{ ! startsWith(github.head_ref, 'changeset-release/') && steps.diff.outputs.lockfile_only != 'true' }}
        run: npx changeset status --since origin/main
